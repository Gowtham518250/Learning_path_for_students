<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAREERGRAPH — Reset password</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main class="card auth"><div class="brand">CAREER<span>GRAPH</span></div><h1>Reset password</h1><p class="muted">We'll generate a reset link for the account.</p><form id="form" class="stack"><div><label>Email</label><input id="email" type="email" required></div><button class="primary">Send reset link</button><div id="msg" class="notice hidden"></div></form><div class="topgap small"><a href="/login">Back to login</a></div></main><script src="/assets/config.js"></script><script src="/assets/api.js"></script><script>
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");try{const r=await CareerGraphAPI.forgotPassword(document.getElementById("email").value);if(r.reset_token)location.href="/reset-password?token="+encodeURIComponent(r.reset_token);else{m.textContent=r.message;m.classList.remove("hidden")}}catch(err){m.textContent=err.message;m.classList.remove("hidden")}};
</script></body></html>
