<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAREERGRAPH — Login</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main class="card auth"><div class="brand">CAREER<span>GRAPH</span></div><h1>Welcome back</h1><p class="muted">Sign in to continue your personalized career graph.</p><form id="form" class="stack"><div><label>Email</label><input id="email" type="email" required></div><div><label>Password</label><input id="password" type="password" minlength="8" required></div><button class="primary" type="submit">Sign in</button><div id="msg" class="notice hidden"></div></form><div class="row between topgap small"><a href="/signup">Create account</a><a href="/forgot-password">Forgot password?</a></div></main><script src="/assets/config.js"></script><script src="/assets/api.js"></script><script>
(async()=>{try{await CareerGraphAPI.me();location.href="/dashboard"}catch(_){}})();
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");m.classList.add("hidden");try{await CareerGraphAPI.login({email:document.getElementById("email").value,password:document.getElementById("password").value});location.href="/dashboard"}catch(err){m.textContent=err.message;m.classList.remove("hidden")}};
</script></body></html>
