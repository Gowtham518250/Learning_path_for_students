<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAREERGRAPH — New password</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main class="card auth"><div class="brand">CAREER<span>GRAPH</span></div><h1>Choose a new password</h1><form id="form" class="stack"><div><label>New password</label><input id="password" type="password" minlength="8" required></div><div><label>Confirm password</label><input id="confirm" type="password" minlength="8" required></div><button class="primary">Update password</button><div id="msg" class="notice hidden"></div></form></main><script src="/assets/config.js"></script><script src="/assets/api.js"></script><script>
const token=new URLSearchParams(location.search).get("token");
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");if(!token){m.textContent="Reset token is missing";m.classList.remove("hidden");return}const p=document.getElementById("password").value;if(p!==document.getElementById("confirm").value){m.textContent="Passwords do not match";m.classList.remove("hidden");return}try{const r=await CareerGraphAPI.resetPassword(token,p);m.textContent=r.message+" You can now sign in.";m.classList.remove("hidden");setTimeout(()=>location.href="/login",1000)}catch(err){m.textContent=err.message;m.classList.remove("hidden")}};
</script></body></html>
