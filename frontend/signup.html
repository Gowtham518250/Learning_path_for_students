<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAREERGRAPH — Create account</title><link rel="stylesheet" href="/assets/styles.css"></head><body><main class="card auth"><div class="brand">CAREER<span>GRAPH</span></div><h1>Create account</h1><p class="muted">Your evidence, skill graph and roadmap stay tied to your account.</p><form id="form" class="stack"><div><label>Full name</label><input id="full_name" required></div><div><label>Email</label><input id="email" type="email" required></div><div><label>Password</label><input id="password" type="password" minlength="8" required></div><div><label>Confirm password</label><input id="confirm" type="password" minlength="8" required></div><button class="primary" type="submit">Create account</button><div id="msg" class="notice hidden"></div></form><div class="topgap small"><a href="/login">Already have an account? Sign in</a></div></main><script src="/assets/config.js"></script><script src="/assets/api.js"></script><script>
document.getElementById("form").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");m.classList.add("hidden");const p=document.getElementById("password").value;if(p!==document.getElementById("confirm").value){m.textContent="Passwords do not match";m.classList.remove("hidden");return}try{const r=await CareerGraphAPI.register({full_name:document.getElementById("full_name").value,email:document.getElementById("email").value,password:p});if(r.verification_token)location.href="/verify-email?token="+encodeURIComponent(r.verification_token);else{m.textContent=r.message+" Check your email to verify the account.";m.classList.remove("hidden")}}catch(err){m.textContent=err.message;m.classList.remove("hidden")}};
</script></body></html>
